name: Release Assets

# On a published release: run the full CI, then attach the bundled OpenAPI specification
# and the generated API documentation (with SHA-256 checksums) to the release.
on:
  release:
    types:
      - published
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle specification and build documentation
        run: |
          pnpm run bundle:openapi
          pnpm run docs:build

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp openapi/bundled/openapi.yaml release-assets/openapi.yaml
          cp docs/dist/index.html release-assets/api-docs.html
          (cd release-assets && sha256sum openapi.yaml api-docs.html > SHA256SUMS)

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" release-assets/* --clobber
