name: CI - OpenAPI & SDK Quality Assurance

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Lint, Validate & Test Specifications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint OpenAPI 3.1 Specification
        run: pnpm run lint:openapi

      - name: Bundle OpenAPI Specification
        run: pnpm run bundle:openapi

      - name: Detect Breaking Changes (SemVer)
        run: pnpm run test:breaking

      # The multi-language SDKs (generate:sdks) are generated at release time by publish-sdks.yml
      - name: Run Generator Pipeline
        run: |
          pnpm run generate:zod
          pnpm run generate:json-schema
          pnpm run generate:mcp
          pnpm run generate:collections

      - name: Run Code Linter & Format Check
        run: |
          pnpm run lint
          pnpm run format:check

      - name: Typecheck & Build
        run: pnpm run build

      - name: Run Vitest Contract & Validation Tests
        run: pnpm test
