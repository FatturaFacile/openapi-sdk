name: Publish Multi-Language SDKs

on:
  push:
    tags:
      - "v*"

jobs:
  publish-npm:
    name: Publish TypeScript SDK to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run bundle:openapi
      - run: pnpm run generate:all
      - run: cd sdk/typescript && pnpm run build
      - name: Publish to npm
        run: cd sdk/typescript && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          cd sdk/python && python -m build
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: cd sdk/python && twine upload dist/*

  publish-nuget:
    name: Publish .NET SDK to NuGet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build and Pack NuGet Package
        run: cd sdk/csharp && dotnet pack -c Release -o out
      - name: Push to NuGet
        run: dotnet nuget push sdk/csharp/out/*.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
