name: Deploy dev

# Every push to dev: run the full CI.
# There is no dev deployment target for the OpenAPI specification yet, so nothing is deployed.
# Add a deploy job here (gated with `if: vars.DEV_DEPLOY_ENABLED == 'true'`) once a target exists.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: dev-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
