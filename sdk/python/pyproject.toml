[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fatturafacile-sdk"
version = "1.0.0"
description = "Official Python SDK for Fattura Facile ERP API"
readme = "README.md"
authors = [{ name = "Fattura Facile Platform Team", email = "api-support@fatturafacile.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://fatturafacile.com"
Repository = "https://github.com/fatturafacile/fatturafacile-openapi-sdk"
