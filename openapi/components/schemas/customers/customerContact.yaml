type: object
required:
  - id
  - firstName
  - lastName
  - email
properties:
  id:
    type: string
    format: uuid
    example: "c3000000-0000-0000-0000-000000000001"
  firstName:
    type: string
    example: "Laura"
  lastName:
    type: string
    example: "Verdi"
  role:
    type:
      - string
      - "null"
    example: "Procurement Manager"
  email:
    type: string
    format: email
    example: "laura.verdi@techsolutions.it"
  phone:
    type:
      - string
      - "null"
    example: "+39 333 1234567"
  isPrimary:
    type: boolean
    default: false
