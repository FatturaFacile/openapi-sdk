type: object
required:
  - title
properties:
  projectId:
    type: string
    format: uuid
  assigneeId:
    type: string
    format: uuid
  title:
    type: string
    example: "Design OpenAPI 3.1 Components"
  description:
    type:
      - string
      - "null"
  priority:
    type: string
    enum: [low, medium, high, urgent]
    default: "medium"
  dueDate:
    type: string
    format: date
