type: object
required:
  - type
  - title
  - status
properties:
  type:
    type: string
    format: uri
    description: A URI reference that identifies the problem type.
    example: "https://api.fatturafacile.com/v1/errors/unprocessable-entity"
  title:
    type: string
    description: A short, human-readable summary of the problem type.
    example: "Validation Error"
  status:
    type: integer
    description: The HTTP status code generated by the origin server.
    example: 422
  detail:
    type: string
    description: A human-readable explanation specific to this occurrence of the problem.
    example: "The provided fiscalCode is invalid for Italian SDI transmission."
  instance:
    type: string
    format: uri
    description: A URI reference that identifies the specific occurrence of the problem.
    example: "https://api.fatturafacile.com/v1/invoices/f1000000-0000-0000-0000-000000000001"
  invalidParams:
    type: array
    description: Detailed list of field-level validation errors.
    items:
      type: object
      required:
        - name
        - reason
      properties:
        name:
          type: string
          description: The name of the parameter or body field that failed validation.
          example: "fiscalCode"
        reason:
          type: string
          description: Explanation of why the parameter failed validation.
          example: "Must be a 16-character alphanumeric code adhering to Italian fiscal calculation rules."
        code:
          type: string
          description: Machine-readable error code.
          example: "INVALID_FISCAL_CODE"
