type: object
required:
  - email
  - password
properties:
  email:
    type: string
    format: email
    description: Registered user email address.
    example: "admin@fatturafacile.com"
  password:
    type: string
    format: password
    description: User password.
    example: "SecureP@ssw0rd123!"
  tenantId:
    type: string
    format: uuid
    description: Optional target tenant ID to authenticate directly into.
    example: "a0000000-0000-0000-0000-000000000001"
