get:
  tags:
    - Files
  summary: Get file metadata
  description: Returns file size, MIME-type, checksum, and secure download URL.
  operationId: getFileById
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  parameters:
    - $ref: ../../components/parameters/tenantHeader.yaml
    - $ref: ../../components/parameters/idPath.yaml
  responses:
    "200":
      description: File record.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/files/fileRecord.yaml
    "401":
      $ref: ../../components/responses/401Unauthorized.yaml
    "404":
      $ref: ../../components/responses/404NotFound.yaml

delete:
  tags:
    - Files
  summary: Delete file
  description: Removes file attachment and deletes underlying object from storage.
  operationId: deleteFile
  security:
    - bearerAuth: []
  parameters:
    - $ref: ../../components/parameters/tenantHeader.yaml
    - $ref: ../../components/parameters/idPath.yaml
  responses:
    "204":
      description: File deleted.
    "401":
      $ref: ../../components/responses/401Unauthorized.yaml
    "404":
      $ref: ../../components/responses/404NotFound.yaml
