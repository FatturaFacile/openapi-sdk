get:
  tags:
    - Invoices
  summary: List invoices
  description: Returns invoices with payment status, SDI transmission receipts, and totals.
  operationId: listInvoices
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  parameters:
    - $ref: ../../components/parameters/tenantHeader.yaml
    - $ref: ../../components/parameters/paginationLimit.yaml
    - $ref: ../../components/parameters/paginationPage.yaml
    - $ref: ../../components/parameters/sorting.yaml
    - $ref: ../../components/parameters/searchQuery.yaml
  responses:
    "200":
      description: Paginated invoices.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                type: array
                items:
                  $ref: ../../components/schemas/invoices/invoice.yaml
              meta:
                $ref: ../../components/schemas/common/paginationMeta.yaml
    "401":
      $ref: ../../components/responses/401Unauthorized.yaml

post:
  tags:
    - Invoices
  summary: Create invoice
  description: Generates a new legal electronic invoice with automatic sequential numbering.
  operationId: createInvoice
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  parameters:
    - $ref: ../../components/parameters/tenantHeader.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/invoices/invoiceCreateRequest.yaml
  responses:
    "201":
      description: Invoice issued.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/invoices/invoice.yaml
    "400":
      $ref: ../../components/responses/400BadRequest.yaml
    "401":
      $ref: ../../components/responses/401Unauthorized.yaml
    "422":
      $ref: ../../components/responses/422UnprocessableEntity.yaml
