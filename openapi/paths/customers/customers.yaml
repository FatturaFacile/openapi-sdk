get:
  tags:
    - Customers
  summary: List customers
  description: Returns paginated customers with optional search and category filters.
  operationId: listCustomers
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  parameters:
    - $ref: ../../components/parameters/tenantHeader.yaml
    - $ref: ../../components/parameters/paginationLimit.yaml
    - $ref: ../../components/parameters/paginationPage.yaml
    - $ref: ../../components/parameters/sorting.yaml
    - $ref: ../../components/parameters/searchQuery.yaml
  responses:
    "200":
      description: Paginated customer list.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                type: array
                items:
                  $ref: ../../components/schemas/customers/customer.yaml
              meta:
                $ref: ../../components/schemas/common/paginationMeta.yaml
    "401":
      $ref: ../../components/responses/401Unauthorized.yaml
    "403":
      $ref: ../../components/responses/403Forbidden.yaml

post:
  tags:
    - Customers
  summary: Create customer
  description: Registers a new business or individual customer.
  operationId: createCustomer
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  parameters:
    - $ref: ../../components/parameters/tenantHeader.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/customers/customerCreateRequest.yaml
  responses:
    "201":
      description: Customer created successfully.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/customer.yaml
    "400":
      $ref: ../../components/responses/400BadRequest.yaml
    "401":
      $ref: ../../components/responses/401Unauthorized.yaml
    "403":
      $ref: ../../components/responses/403Forbidden.yaml
    "422":
      $ref: ../../components/responses/422UnprocessableEntity.yaml
