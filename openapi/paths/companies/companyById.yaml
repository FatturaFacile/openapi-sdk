get:
  tags:
    - Companies
  summary: Get company by ID
  description: Returns legal and fiscal configuration of a company.
  operationId: getCompanyById
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  parameters:
    - $ref: ../../components/parameters/idPath.yaml
  responses:
    "200":
      description: Company profile.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/companies/company.yaml
    "401":
      $ref: ../../components/responses/401Unauthorized.yaml
    "404":
      $ref: ../../components/responses/404NotFound.yaml
