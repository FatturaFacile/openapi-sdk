get:
  tags:
    - Companies
  summary: List companies
  description: Returns companies managed under user authorization.
  operationId: listCompanies
  security:
    - bearerAuth: []
  responses:
    "200":
      description: Company list.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../components/schemas/companies/company.yaml
    "401":
      $ref: ../../components/responses/401Unauthorized.yaml
    "403":
      $ref: ../../components/responses/403Forbidden.yaml
