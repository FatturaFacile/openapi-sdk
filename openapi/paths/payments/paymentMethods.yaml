get:
  tags:
    - Payments
  summary: List payment methods
  description: Returns available payment modalities (Bonifico, RiBa, Credit Card, PayPal).
  operationId: listPaymentMethods
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  parameters:
    - $ref: ../../components/parameters/tenantHeader.yaml
  responses:
    "200":
      description: List of payment methods.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../components/schemas/payments/paymentMethod.yaml
    "401":
      $ref: ../../components/responses/401Unauthorized.yaml
