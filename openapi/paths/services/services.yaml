get:
  tags:
    - Services
  summary: List services
  description: Returns billable consulting, support, and hourly service offerings.
  operationId: listServices
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  parameters:
    - $ref: ../../components/parameters/tenantHeader.yaml
    - $ref: ../../components/parameters/paginationLimit.yaml
    - $ref: ../../components/parameters/paginationPage.yaml
    - $ref: ../../components/parameters/sorting.yaml
  responses:
    "200":
      description: Paginated service list.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                type: array
                items:
                  $ref: ../../components/schemas/services/service.yaml
              meta:
                $ref: ../../components/schemas/common/paginationMeta.yaml
    "401":
      $ref: ../../components/responses/401Unauthorized.yaml

post:
  tags:
    - Services
  summary: Create service
  description: Defines a new service item.
  operationId: createService
  security:
    - bearerAuth: []
  parameters:
    - $ref: ../../components/parameters/tenantHeader.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/services/serviceCreateRequest.yaml
  responses:
    "201":
      description: Service created.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/services/service.yaml
    "400":
      $ref: ../../components/responses/400BadRequest.yaml
    "401":
      $ref: ../../components/responses/401Unauthorized.yaml
    "422":
      $ref: ../../components/responses/422UnprocessableEntity.yaml
