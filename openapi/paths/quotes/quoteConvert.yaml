post:
  tags:
    - Quotes
  summary: Convert quote to invoice
  description: Converts accepted quote directly into an issued invoice with identical line items.
  operationId: convertQuoteToInvoice
  security:
    - bearerAuth: []
  parameters:
    - $ref: ../../components/parameters/tenantHeader.yaml
    - $ref: ../../components/parameters/idPath.yaml
  responses:
    "201":
      description: Invoice created from quote.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/invoices/invoice.yaml
    "400":
      $ref: ../../components/responses/400BadRequest.yaml
    "401":
      $ref: ../../components/responses/401Unauthorized.yaml
    "404":
      $ref: ../../components/responses/404NotFound.yaml
    "422":
      $ref: ../../components/responses/422UnprocessableEntity.yaml
